<VirtualHost *:80>
    ServerName catlynx.local
    ServerAlias www.catlynx.local
    DocumentRoot /var/www/catlynx

    <Files "documentacion.info">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/catlynx_error.log
    CustomLog ${APACHE_LOG_DIR}/catlynx_access.log combined
</VirtualHost>
