<VirtualHost *:80>
    ServerName nodisknobuy.local
    ServerAlias www.nodisknobuy.local
    DocumentRoot /var/www/nodisknobuy

    <Files "physical-release.info">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/nodisknobuy_error.log
    CustomLog ${APACHE_LOG_DIR}/nodisknobuy_access.log combined
</VirtualHost>
