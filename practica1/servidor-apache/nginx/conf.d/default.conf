# Servidor HTTP: redirige las peticiones a HTTPS
server {
    listen 80;
    server_name catlynx.local www.catlynx.local
                nodisknobuy.local www.nodisknobuy.local;
    limit_req_zone $binary_remote_addr zone=nimbus_limit:10m rate=3r/s;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name catlynx.local www.catlynx.local
                nodisknobuy.local www.nodisknobuy.local;
    
    # Limitar peticiones por dirección IP
    limit_req zone=nimbus_limit burst=6 nodelay;
    
    # Cabeceras de seguridad HTTP
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Certificado TLS y clave privada
    ssl_certificate /etc/nginx/certs/nimbusdocs.crt;
    ssl_certificate_key /etc/nginx/certs/nimbusdocs.key;

    # Permitir únicamente TLS 1.2 y TLS 1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Suites criptográficas para TLS 1.2
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Enviar las peticiones a Apache
    location / {
	proxy_pass http://apache:80;
        
	# Conservar el dominio original solicitado por el cliente
        proxy_set_header Host $host;

        # Conservar información de la conexión original
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
